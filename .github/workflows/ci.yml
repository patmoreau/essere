name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/patmoreau/essere/essere-app

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install node and pnpm from mise.toml
        uses: jdx/mise-action@v4

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  publish:
    name: Publish image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Homelab
    needs: publish
    # Self-hosted runner on lxc-essere (provisioned by the my-homelab github-runner role).
    runs-on: [self-hosted, essere]
    permissions:
      contents: read
      packages: read
    environment:
      name: production

    steps:
      # No checkout or registry login needed: the prod containers are Quadlet units run by
      # rootful Podman (GHCR login already deployed on the host by the homelab role); this
      # job only rolls their images.
      - name: Roll images via auto-update
        # essere-app carries io.containers.autoupdate=registry; this pulls the newest
        # :latest and restarts the unit only when the image digest changed.
        run: sudo podman auto-update

      - name: Prune dangling images
        run: sudo podman image prune -f
